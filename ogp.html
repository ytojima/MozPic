<!doctype html>
<!-- OGP image source (1200x630). Rendered to public/ogp.png by `npm run ogp`; not part of the app build. -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1b1b2f; }
      body { position: relative; font-family: 'M PLUS Rounded 1c', sans-serif; color: #fff; }
      #bg { position: absolute; inset: 0; width: 1200px; height: 630px; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15, 10, 30, 0.55) 0%, rgba(15, 10, 30, 0.15) 55%, rgba(15, 10, 30, 0) 100%); }

      .card {
        position: absolute; left: 64px; top: 50%; transform: translateY(-50%);
        width: 680px; padding: 52px 56px 48px; border-radius: 40px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(22px) saturate(180%);
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.7),
          inset 0 -1px 2px rgba(255, 255, 255, 0.2),
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.35),
          0 24px 60px rgba(10, 5, 30, 0.45);
        overflow: hidden;
      }
      .card::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0) 75%, rgba(255, 255, 255, 0.1) 100%);
      }
      .logo { display: flex; align-items: center; gap: 22px; }
      .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 72px; height: 72px; }
      .tiles i { border-radius: 9px; box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.45); }
      .tiles i:nth-child(1) { background: #ff5c8a; }
      .tiles i:nth-child(2) { background: #ffd166; }
      .tiles i:nth-child(3) { background: #3dd6b0; }
      .tiles i:nth-child(4) { background: #7b5cff; }
      h1 { margin: 0; font-size: 104px; font-weight: 800; letter-spacing: 0.01em; line-height: 1; text-shadow: 0 4px 24px rgba(20, 10, 50, 0.35); }
      .tagline { margin: 30px 0 0; white-space: nowrap; font-size: 46px; font-weight: 800; line-height: 1.3; text-shadow: 0 2px 16px rgba(20, 10, 50, 0.35); }
      .sub { margin: 14px 0 0; white-space: nowrap; font-size: 24px; font-weight: 700; line-height: 1.5; opacity: 0.92; }
      .icons { display: flex; gap: 12px; margin-top: 34px; }
      .icons span {
        display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px;
        background: rgba(255, 255, 255, 0.2); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
      .icons svg { width: 24px; height: 24px; fill: #fff; }
    </style>
  </head>
  <body>
    <canvas id="bg" width="1200" height="630"></canvas>
    <div class="shade"></div>
    <div class="card">
      <div class="logo">
        <span class="tiles"><i></i><i></i><i></i><i></i></span>
        <h1>MozPic</h1>
      </div>
      <p class="tagline">あそべるモザイクメーカー</p>
      <p class="sub">画像をえらぶだけで、15種類のモザイク画に。<br />画像はサーバに送らず、すべてブラウザの中で。</p>
      <div class="icons" id="icons"></div>
    </div>
    <script type="module" src="/src/ogp.js"></script>
  </body>
</html>
