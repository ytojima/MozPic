<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'><rect width='1' height='1' fill='%23ff5c8a'/><rect x='1' width='1' height='1' fill='%23ffd166'/><rect y='1' width='1' height='1' fill='%233dd6b0'/><rect x='1' y='1' width='1' height='1' fill='%237b5cff'/></svg>" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash
      try {
        var t = localStorage.getItem('mozpic:theme')
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>MozPic - あそべるモザイクメーカー</title>
    <meta name="description" content="画像をえらぶだけで、ハニカム・ステンドグラス・ブロック・アイコンなど15種類のモザイク画に。画像はサーバに送信・保存されず、すべてブラウザの中だけで処理します。ガチャやアニメーションで遊べるモザイクメーカー。" />
    <meta name="theme-color" content="#7b5cff" />

    <!-- OGP: set VITE_SITE_URL in .env to the production origin so image/url become absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MozPic" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="MozPic - あそべるモザイクメーカー" />
    <meta property="og:description" content="画像をえらぶだけで、15種類のモザイク画に。画像はサーバに送信・保存されず、すべてブラウザの中だけで処理します。" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MozPic のロゴと、ハニカム・アイコン・ステンドグラス・ブロック・ドットのモザイク柄" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MozPic - あそべるモザイクメーカー" />
    <meta name="twitter:description" content="画像をえらぶだけで、15種類のモザイク画に。画像はサーバに送信・保存されず、すべてブラウザの中だけで処理します。" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/ogp.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
